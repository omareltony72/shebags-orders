<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>She Bags — الأوردرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1f1b16;--mut:#7a7168;--line:#e7e1da;--acc:#b0426b;--acc2:#f7e6ed;--ok:#2f7d4f;--okb:#e3f3e8;--warn:#a86400;--warnb:#fff2dc;--bad:#b3261e;--badb:#fde7e5;--blue:#2c5c9c;--blueb:#e6eefa}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:980px;margin:auto}
.logo{font-weight:700;color:var(--acc);font-size:18px}
.who{margin-inline-start:auto;font-size:13px;color:var(--mut)}
nav{display:flex;gap:4px;padding:0 12px;max-width:980px;margin:auto;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--mut);font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:980px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--badb);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.items .it{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.oits{display:grid;gap:6px;margin:6px 0}.oit{display:flex;gap:10px;align-items:center}.oit .thumb{width:64px;height:64px;flex:none}.bc{font-family:monospace;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--acc)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--acc2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:700;font-size:12px;text-align:center;overflow:hidden}
.it .nm{font-weight:700}.it .sub{font-size:13px;color:var(--mut)}
.qty{display:flex;align-items:center;gap:6px}
.qty input{width:56px;text-align:center;padding:6px}
.qty .pr{width:80px}
.sum{display:grid;gap:6px;background:var(--bg);border-radius:12px;padding:12px;margin-top:12px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:19px;font-weight:700;color:var(--acc);border-top:1px solid var(--line);padding-top:6px}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.warnbox{background:var(--warnb);color:var(--warn);padding:8px 12px;border-radius:10px;font-size:13px;margin-top:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.s-new{background:var(--warnb);color:var(--warn)}.s-confirmed{background:var(--okb);color:var(--ok)}.s-exported{background:var(--blueb);color:var(--blue)}.s-cancelled{background:#eee;color:#666}.s-returned{background:var(--badb);color:var(--bad)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ord{display:grid;gap:4px}
.ord .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ord .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.muted{color:var(--mut);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(20,15,10,.45);display:none;z-index:20;align-items:flex-end;justify-content:center;padding-top:60px}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;height:78vh;max-height:78vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media(min-width:700px){.modal{align-items:center;padding:30px}.sheet{border-radius:18px;height:80vh}}
.sheet .sh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-shrink:0}
.xbtn{width:42px;height:42px;border-radius:12px;border:0;background:var(--badb);color:var(--bad);font-size:20px;font-weight:700;cursor:pointer;flex-shrink:0}
.chk{width:22px;height:22px;accent-color:var(--acc);flex-shrink:0}
.selbar{position:sticky;bottom:10px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:4}
.big{font-size:22px}.stat.hl{border-color:var(--acc);background:var(--acc2)}
.s-prepared{background:#efe6fa;color:#6a3fa0}.s-shipping{background:var(--blueb);color:var(--blue)}.s-collected{background:var(--okb);color:var(--ok)}.s-partial{background:#fff0e0;color:#a4540b}
.sheet .sb{padding:12px 16px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pc{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;position:relative;text-align:start;padding:0}
.pc .im{aspect-ratio:1;background:var(--acc2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:700;padding:8px;text-align:center}
.pc .tx{padding:5px 6px;font-size:12px}
.pc .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.out{opacity:.45}
.star{position:absolute;top:6px;left:6px;background:#fff;border-radius:99px;width:28px;height:28px;border:1px solid var(--line);cursor:pointer;font-size:15px;line-height:26px;text-align:center}
.vlist .v{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff;width:100%}
.vlist .v:disabled{opacity:.45}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:40;display:none;max-width:90vw}
.center{max-width:380px;margin:60px auto}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:start}
.hide{display:none!important}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.stat b{font-size:18px;display:block}
</style>
</head>
<body>
<div id="auth" class="center hide">
  <div class="card">
    <div class="logo" style="margin-bottom:8px">She Bags</div>
    <h2 id="authTitle">تسجيل الدخول</h2>
    <div id="bsName" class="hide"><label>اسمك</label><input id="aName"></div>
    <label>الإيميل</label><input id="aEmail" type="email" dir="ltr">
    <label>الباسورد</label><input id="aPass" type="password" dir="ltr">
    <div id="aErr" class="err"></div>
    <button class="btn" style="width:100%;margin-top:14px" id="aBtn">دخول</button>
  </div>
</div>

<div id="app" class="hide">
<header>
  <div class="top"><span class="logo">She Bags</span><span class="muted">أوردرات الأونلاين</span>
    <span class="who" id="who"></span><button class="btn ghost sm" id="logout">خروج</button></div>
  <nav id="nav">
    <button data-v="new" class="on">➕ أوردر جديد</button>
    <button data-v="orders">📦 الأوردرات</button>
    <button data-v="money" class="adm hide">💰 الشحن والتحصيل</button>
    <button data-v="users" class="adm hide">👥 الفريق</button>
  </nav>
</header>
<main>
<!-- NEW ORDER -->
<section id="v-new">
  <div class="card">
    <h2>بيانات العميل</h2>
    <div class="row">
      <div><label>اسم العميل *</label><input id="fName"></div>
      <div><label>الموبايل *</label><input id="fPhone" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx"><div id="phoneMsg"></div></div>
    </div>
    <div class="row">
      <div><label>المنطقة / المحافظة *</label><select id="fZone"></select>
        <label style="margin-top:8px">مصاريف الشحن (تقدر تعدّلها)</label><input id="fShip" inputmode="numeric" dir="ltr" placeholder="اختار المنطقة الأول"></div>
      <div><label>موبايل تاني (اختياري)</label><input id="fPhone2" inputmode="tel" dir="ltr"></div>
    </div>
    <label>العنوان بالتفصيل *</label><textarea id="fAddr" placeholder="المنطقة - الشارع - رقم العمارة - الدور - علامة مميزة"></textarea>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0">المنتجات</h2>
      <button class="btn sec sm" style="margin-inline-start:auto" id="addItem">+ إضافة منتج</button></div>
    <div class="items" id="items"></div>
    <div id="noItems" class="muted" style="padding:12px 0">لسه مفيش منتجات — دوس "إضافة منتج"</div>
    <div class="row">
      <div><label>العربون المدفوع</label><input id="fDep" inputmode="numeric" value="0" dir="ltr"></div>
      <div><label>ملاحظات</label><input id="fNotes" placeholder="مثلاً: يتصل قبلها"></div>
    </div>
    <div class="sum">
      <div><span>المنتجات</span><span id="sSub">0</span></div>
      <div><span>الشحن</span><span id="sShip">—</span></div>
      <div><span>العربون</span><span id="sDep">0</span></div>
      <div class="tot"><span>المطلوب تحصيله</span><span id="sCod">0</span></div>
    </div>
    <div id="fErr" class="err"></div>
    <button class="btn" style="width:100%;margin-top:12px;padding:13px" id="save">حفظ الأوردر</button>
  </div>
</section>

<!-- ORDERS -->
<section id="v-orders" class="hide">
  <div class="stats" id="stats"></div>
  <div class="card" style="padding:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="q" placeholder="بحث بالاسم أو الموبايل أو رقم الأوردر" style="flex:1;min-width:180px">
      <button class="btn ghost sm" id="refresh">تحديث</button>
    </div>
    <div class="filters" id="filters" style="margin-top:10px"></div>
  </div>
  <div id="list"></div>
  <div class="selbar hide" id="selbar"><b id="selCount"></b><button class="btn sm ghost" id="selAll">تحديد الكل</button><button class="btn ok sm" id="export" style="margin-inline-start:auto">⬇️ تصدير المحدد لشركة الشحن</button></div>
</section>

<!-- MONEY (admin) -->
<section id="v-money" class="hide">
  <div class="stats" id="mStats"></div>
  <div class="card" style="padding:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="mq" placeholder="بحث بالاسم أو الموبايل أو رقم الأوردر" style="flex:1;min-width:180px">
      <button class="btn ghost sm" id="mRefresh">تحديث</button>
    </div>
    <div class="filters" id="mFilters" style="margin-top:10px"></div>
  </div>
  <div id="mList"></div>
</section>

<!-- USERS -->
<section id="v-users" class="hide">
  <div class="card">
    <h2>إضافة حد للفريق</h2>
    <div class="row"><div><label>الاسم</label><input id="uName"></div><div><label>الإيميل</label><input id="uEmail" dir="ltr"></div></div>
    <div class="row"><div><label>الباسورد</label><input id="uPass" dir="ltr"></div>
      <div><label>الدور</label><select id="uRole"><option value="moderator">مودريتور (جديد / تأكيد / تجهيز)</option><option value="admin">أدمن (كل حاجة)</option></select></div></div>
    <button class="btn" style="margin-top:12px" id="uAdd">إضافة</button><span id="uErr" class="err"></span>
  </div>
  <div class="card"><h2>الفريق</h2><div id="uList"></div></div>
</section>
</main>
</div>

<div class="modal" id="pick"><div class="sheet">
  <div class="sh"><input id="pq" placeholder="ابحث باسم الموديل أو الكود…" style="flex:1"><button class="xbtn" id="pClose" aria-label="إغلاق">✕</button></div>
  <div class="sb" id="pBody"></div>
</div></div>
<div class="modal" id="settle"><div class="sheet" style="height:auto;max-height:85vh">
  <div class="sh"><b style="flex:1" id="stTitle">استلام جزئي</b><button class="xbtn" onclick="$('#settle').classList.remove('on')">✕</button></div>
  <div class="sb" id="stBody"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const SB_URL="https://hnyhclyurrbbskqgyopw.supabase.co";
const SB_KEY="sb_publishable_DJb6O8elVmEuWhCFtSRjvw_Va9c693H";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=s=>Number(String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d.]/g,""))||0;
const digits=s=>String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g,"").replace(/^20(?=1)/,"").replace(/^(?=1[0125]\d{8}$)/,"0");
const money=n=>Number(n||0).toLocaleString("en-US")+" ج";
function toast(m,ms=2600){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",ms)}

/* ---- zones: [label, city value for QP sheet, fee] ---- */
const Z=(fee,city,names)=>names.split("|").map(n=>[n,city,fee]);
const ZONES=[
 ["مترو",[["مترو","مترو",55]]],
 ["القاهرة والجيزة",[["القاهرة","قاهره",70],["الجيزة","جيزة",70]]],
 ["مدن جديدة",[...Z(75,"قليوبية","العبور"),...Z(75,"شرقيه","العاشر من رمضان")]],
 ["القناة والإسكندرية",[["الإسكندرية","اسكندريه",80],["الإسماعيلية","اسماعيلية",80],["السويس","سويس",80],["بورسعيد","بورسعيد",80]]],
 ["الدلتا",[["الدقهلية","دقهلية",85],["القليوبية","قليوبية",85],["الغربية","غربيه",85],["الشرقية","شرقيه",85],["دمياط","دمياط",85],["كفر الشيخ","كفر الشيخ",85],["البحيرة","البحيرة",85],["المنوفية","المنوفية",85]]],
 ["الصعيد",[["الفيوم","فيوم",95],["بني سويف","بني سويف",95],["المنيا","منيا",95],["أسيوط","اسيوط",95],["سوهاج","سوهاج",95],["قنا","قنا",95],["الأقصر","اقصر",95],["أسوان","اسوان",95]]],
 ["الساحل والغردقة",[...Z(105,"مطروح","مرسى مطروح|الساحل الشمالي|العلمين|سيدي عبد الرحمن|مدينة الحمام"),["الغردقة","بحر الاحمر",105]]],
 ["شرم الشيخ",[["شرم الشيخ","شرم الشيخ",120]]],
 ["أماكن بعيدة",[...Z(125,"بحر الاحمر","سفاجا|القصير|رأس غارب|مرسى علم|خليج مكادي"),...Z(125,"جنوب سيناء","الطور|دهب")]],
];
const ZMAP={};ZONES.forEach(([,l])=>l.forEach(z=>ZMAP[z[0]]=z));
$("#fZone").innerHTML='<option value="">— اختار —</option>'+ZONES.map(([g,l])=>`<optgroup label="${g}">${l.map(z=>`<option value="${z[0]}">${z[0]} — ${z[2]} ج</option>`).join("")}</optgroup>`).join("");

/* ---- state ---- */
let ME=null, PROFILES={}, CAT=null, FEAT=new Set(), ITEMS=[], ORDERS=[], FILTER="new";
async function api(action,body={}){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(SB_URL+"/functions/v1/api",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+(session?.access_token||SB_KEY)},body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({error:"خطأ في الاتصال"}));
  if(!r.ok||j.error) throw new Error(j.error||"خطأ");
  return j;
}

/* ---- auth ---- */
let BOOT=false;
async function showAuth(){
  $("#app").classList.add("hide");$("#auth").classList.remove("hide");
  try{BOOT=(await api("needs_bootstrap")).needs}catch{}
  $("#authTitle").textContent=BOOT?"أول مرة — اعمل حساب الأدمن":"تسجيل الدخول";
  $("#bsName").classList.toggle("hide",!BOOT);$("#aBtn").textContent=BOOT?"إنشاء حساب الأدمن":"دخول";
}
$("#aBtn").onclick=async()=>{
  $("#aErr").textContent="";const email=$("#aEmail").value.trim(),password=$("#aPass").value;
  try{
    if(BOOT) await api("bootstrap",{email,password,name:$("#aName").value.trim()});
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw new Error("الإيميل أو الباسورد غلط");
    boot();
  }catch(e){$("#aErr").textContent=e.message}
};
$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return showAuth();
  const {data:ps}=await sb.from("profiles").select("*");
  (ps||[]).forEach(p=>PROFILES[p.id]=p);
  ME=PROFILES[session.user.id];
  if(!ME||ME.role==="disabled"){await sb.auth.signOut();return showAuth()}
  $("#auth").classList.add("hide");$("#app").classList.remove("hide");
  $("#who").textContent=ME.name;
  document.querySelectorAll(".adm").forEach(e=>e.classList.toggle("hide",ME.role!=="admin"));
  loadCat();loadOrders();
  setInterval(()=>{if(!$("#v-orders").classList.contains("hide")||!$("#v-money").classList.contains("hide"))loadOrders()},30000);
}

/* ---- nav ---- */
function go(v){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  ["new","orders","money","users"].forEach(x=>$("#v-"+x).classList.toggle("hide",x!==v));
  if(v==="orders"||v==="money")loadOrders(); if(v==="users")loadUsers();}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)};

/* ---- catalog ---- */
async function loadCat(force){
  try{CAT=await api("catalog",{force});}catch(e){CAT={products:[],error:e.message}}
  const {data:f}=await sb.from("featured").select("item_id");FEAT=new Set((f||[]).map(x=>x.item_id));
  if($("#pick").classList.contains("on")) renderPick();
}
const pAvail=p=>p.variants.reduce((s,v)=>s+Math.max(0,v.available),0);
const pPrice=p=>{const ps=[...new Set(p.variants.map(v=>v.price))];return ps.length>1?Math.min(...ps)+"+":ps[0]};
function card(p){
  const a=pAvail(p),out=p.track&&a<=0;
  return `<button class="pc ${out?"out":""}" data-p="${p.item_id}">
   <div class="im" style="${p.image?`background-image:url('${esc(p.image)}')`:""}">${p.image?"":esc(p.name)}</div>
   ${ME.role==="admin"?`<span class="star" data-star="${p.item_id}">${FEAT.has(p.item_id)?"★":"☆"}</span>`:""}
   <div class="tx"><b>${esc(p.name)}</b>${pPrice(p)} ج · ${out?'<span style="color:var(--bad)">نفد</span>':p.track?`متاح ${a}`:""}</div></button>`;
}
function renderPick(){
  const b=$("#pBody");
  if(!CAT){b.innerHTML='<p class="muted">جاري تحميل المنتجات من Loyverse…</p>';return}

const ST={new:"جديد",confirmed:"مؤكد",prepared:"تم التجهيز",shipping:"مع شركة الشحن",collected:"تم التحصيل",partial:"استلام جزئي",returned:"مرتجع",cancelled:"ملغي"};

function orderCard(o,acts,extra=""){

const waBtn=o=>`<button class="btn ghost sm" data-wa="${o.id}">📋 واتساب</button>`;

    if(o.status==="prepared"&&isAdmin())acts.push(`<button class="btn ghost sm" data-a="back" data-id="${o.id}">رجّعه لمؤكد</button>`,`<button class="btn bad sm" data-a="cancelled" data-id="${o.id}">إلغاء (يرجّع المخزون)</button>`);

  }).join("")||'<p class="muted" style="text-align:center">مفيش أوردرات هنا</p>';

function downloadQP(orders){
  const H=["serial","full name","phone","address","total amount","total fees","COD","Collected","Returned","notes","order date","shipment contents","weight","city","status","status note","reference ID","customer serial"];
  const rows=orders.map(o=>{const r={};H.forEach(h=>r[h]="");
    Object.assign(r,{"full name":o.customer_name,phone:o.phone,address:o.address+(o.phone2?` - موبايل تاني ${o.phone2}`:""),"total amount":Number(o.cod),notes:o.notes||"","shipment contents":o.contents,weight:1,city:o.city,"reference ID":String(o.id)});return r});
  const ws=XLSX.utils.json_to_sheet(rows,{header:H});
  ws["!cols"]=H.map(h=>({wch:["address","shipment contents"].includes(h)?45:14}));
  rows.forEach((_,i)=>{const c=ws[XLSX.utils.encode_cell({r:i+1,c:2})];if(c){c.t="s";c.z="@"}});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
  const d=new Date();XLSX.writeFile(wb,`shebags_qp_${d.toISOString().slice(0,10)}_${d.getHours()}${String(d.getMinutes()).padStart(2,"0")}.xlsx`);
}

function openSettle(id,kind){

  $("#stTitle").textContent=`استلام جزئي — #${id}`;
  $("#stBody").innerHTML=`<p class="muted">حدد الكمية اللي <b>رجعت</b> من كل منتج. الباقي هيتحسب إنه اتباع.</p>
   ${o.items.map((i,k)=>`<div class="it" style="grid-template-columns:1fr auto"><div><div class="nm">${esc(i.name)}</div><div class="sub">${esc(i.color||"")} · ${i.price} ج · الكمية ${i.qty}</div></div>
     <div class="qty"><span class="muted">راجع</span><input data-rk="${k}" value="0" inputmode="numeric"></div></div>`).join("")}
   <label>صافي ليك عند شركة الشحن (ممكن تعدّله)</label><input id="stNet" inputmode="numeric" dir="ltr">
   <div class="muted" id="stCalc"></div>
   <div id="stErr" class="err"></div>
   <button class="btn" style="width:100%;margin-top:12px" id="stGo">تأكيد الاستلام الجزئي</button>`;
  const calc=()=>{let kept=0;o.items.forEach((i,k)=>{const r=Math.min(i.qty,num($(`[data-rk="${k}"]`).value));kept+=(i.qty-r)*i.price});
    const net=kept-Number(o.deposit);$("#stNet").value=net;$("#stCalc").textContent=`المنتجات المستلمة ${money(kept)} − العربون ${money(o.deposit)} = ${money(net)} · العميل يدفع للمندوب ${money(kept+Number(o.shipping_fee)-Number(o.deposit))}`};
  $("#stBody").oninput=e=>{if(e.target.dataset.rk!=null)calc()};calc();
  $("#stGo").onclick=()=>{const ret=o.items.map((i,k)=>({variant_id:i.variant_id,qty:Math.min(i.qty,num($(`[data-rk="${k}"]`).value))})).filter(r=>r.qty>0);
    if(!ret.length){$("#stErr").textContent="حدد منتج راجع واحد على الأقل";return}
    doSettle(id,"partial",ret,$("#stNet").value)};
  $("#settle").classList.add("on");
}
let SETTLING=false;
async function doSettle(id,kind,returned,net){
  if(SETTLING)return;SETTLING=true;const go=$("#stGo");if(go)go.disabled=true;
  try{const r=await api("settle",{order_id:id,kind,returned,net_amount:net});$("#settle").classList.remove("on");toast("✅ تم"+(r.receipt?` — فاتورة ${r.receipt}`:""));CAT=null}
  catch(err){toast("❌ "+err.message,7000)}
  SETTLING=false;if(go)go.disabled=false;
  loadOrders();
}

/* ---- users ---- */
const RL={admin:"أدمن",moderator:"مودريتور",disabled:"موقوف"};
async function loadUsers(){
  try{const {users}=await api("users");
    $("#uList").innerHTML=`<table>${users.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="muted" dir="ltr" style="text-align:right">${esc(u.email)}</div></td>
      <td><select data-role="${u.id}">${Object.entries(RL).map(([k,v])=>`<option value="${k}" ${u.role===k?"selected":""}>${v}</option>`).join("")}</select></td>
      <td><button class="btn ghost sm" data-pw="${u.id}">باسورد جديد</button></td></tr>`).join("")}</table>`;
  }catch(e){$("#uList").textContent=e.message}
}
$("#uList").onchange=async e=>{const id=e.target.dataset.role;if(!id)return;try{await api("update_user",{id,role:e.target.value});toast("اتغيّر")}catch(err){toast(err.message);loadUsers()}};
$("#uList").onclick=async e=>{const id=e.target.dataset.pw;if(!id)return;const pw=prompt("الباسورد الجديد (٦ حروف على الأقل)");if(!pw)return;try{await api("update_user",{id,password:pw});toast("اتغيّر الباسورد")}catch(err){toast(err.message)}};
$("#uAdd").onclick=async()=>{$("#uErr").textContent="";try{await api("create_user",{name:$("#uName").value.trim(),email:$("#uEmail").value.trim(),password:$("#uPass").value,role:$("#uRole").value});
  const {data:ps}=await sb.from("profiles").select("*");(ps||[]).forEach(p=>PROFILES[p.id]=p);["#uName","#uEmail","#uPass"].forEach(s=>$(s).value="");toast("اتضاف ✅");loadUsers()}catch(e){$("#uErr").textContent=e.message}};

renderItems();boot();
</script>
